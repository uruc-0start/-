<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Log - FPS Friendly Demo</title>
    <style>
      body { margin:0; font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; }
      .wrap { display:grid; place-items:center; min-height:100vh; gap:12px; }
      canvas { border:1px solid #334155; background:#020617; border-radius:8px; }
      .toolbar { display:flex; gap:8px; align-items:center; }
      button { background:#1d4ed8; border:none; color:white; padding:8px 12px; border-radius:6px; cursor:pointer; }
      button:hover { background:#2563eb; }
      .hint { color:#94a3b8; font-size:14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>軽量エフェクト (FPS優先)</h1>
      <div class="toolbar">
        <button id="burst">Burst</button>
        <span id="fps">FPS: --</span>
      </div>
      <canvas id="view" width="800" height="420"></canvas>
      <p class="hint">クリック or Burst でパーティクル。短く柔らかい音を再生。</p>
    </div>
    <script type="module" src="src/game.js"></script>
  </body>
</html>
